<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn — Parco Lee</title>
<meta name="description" content="Course notes on computer networking. Still being organised.">
<style>
  :root{
    --void:#07070b;
    --neon:#22d3ee;
    --neon-2:#f472b6;
    --muted:#8fa3a8;
    --mono:ui-monospace,"Cascadia Mono",Consolas,"SFMono-Regular",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:32px;
    background:
      radial-gradient(56% 62% at 20% 0%, rgba(34,211,238,.16), transparent 62%),
      radial-gradient(44% 52% at 86% 12%, rgba(244,114,182,.13), transparent 64%),
      var(--void);
    color:#eef9fb;
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  .panel{
    width:min(560px,100%);
    border:1px solid rgba(34,211,238,.32);
    border-radius:18px;
    padding:clamp(26px,5vw,40px);
    background:rgba(255,255,255,.03);
    box-shadow:0 30px 90px -50px rgba(34,211,238,.9), inset 0 0 0 1px rgba(255,255,255,.03);
  }
  .kicker{
    margin:0 0 14px;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.26em;
    text-transform:uppercase;
    color:var(--neon);
  }
  h1{
    margin:0 0 14px;
    font-size:clamp(1.5rem,4vw,2rem);
    letter-spacing:-.02em;
  }
  p{margin:0 0 12px;color:#c5d6da;line-height:1.65}
  .zh{color:var(--muted);font-size:.95rem}
  a{
    display:inline-block;
    margin-top:14px;
    font-family:var(--mono);
    font-size:13px;
    color:#bff5ff;
    text-decoration:none;
    border-bottom:1px solid rgba(34,211,238,.5);
    padding-bottom:1px;
  }
  a:hover{border-bottom-color:var(--neon-2);color:#fff}
  :focus-visible{outline:2px solid var(--neon);outline-offset:3px;border-radius:6px}
</style>
</head>
<body>
  <main class="panel">
    <p class="kicker">learn</p>
    <h1>Notes are being organised.</h1>
    <p>Course notes on computer networking, rewritten in plain language — not published yet.</p>
    <p class="zh">計算機網絡課程的筆記還在整理中，暫時未公開。</p>
    <a href="../">← Back to the homepage / 返回主頁</a>
  </main>
</body>
</html>
